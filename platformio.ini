; PlatformIO Project Configuration for ESP32-C6 Super Mini - Arduboy Port
[platformio]
default_envs = esp32c6_super_mini

[env:esp32c6_super_mini]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino

; Architecture & Hardware Settings
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
; OTA (Fase 3): min_spiffs reparte los 4 MB en dos slots de app de 1,9 MB
; (default.csv solo deja 1,25 MB) para que quepan los packs .bin por Wi-Fi.
board_build.partitions = min_spiffs.csv

; Release USB-CDC from GPIO 12/13 so GPIO 13 functions as pure digital input for D-Pad LEFT
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUBOY_ESP32C6

; Catalogo modular: cada juego vive en ports/<juego>/ (fuera de src/).
; SCons compila src/ y ademas todos los ports.
build_src_filter = +<*> +<../ports/>

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

; -----------------------------------------------------------------------------
; Emulador nativo de PC (Linux/macOS con SDL2). Compila los cartuchos reales de
; ports/ contra los shims de sim/ y dibuja el OLED 128x64 a escala 5x (640x320).
;   sudo apt install libsdl2-dev
;   pio run -e pc_emulator && .pio/build/pc_emulator/program
; No toca el firmware: el entorno ESP32 sigue siendo el default.
; -----------------------------------------------------------------------------
[env:pc_emulator]
platform = native
build_flags =
    -std=gnu++17
    -O2
    -DPC_EMULATOR
    -Iinclude
    -Isim
    -lSDL2

; Solo el nucleo portable (console_core.cpp) y el emulador; src/main.cpp y todo
; lo que depende de Wi-Fi/I2C/NVS de ESP32 se queda fuera del build nativo.
build_src_filter = +<console_core.cpp> +<sfx_pcm.cpp> +<../sim/> +<../ports/>

; Los ports no son un paquete de PlatformIO: se compilan como fuentes sueltas.
lib_ldf_mode = off
