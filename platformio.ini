; PlatformIO Project Configuration for ESP32-C6 Super Mini - Arduboy Port
[platformio]
default_envs = esp32c6_super_mini

[env:esp32c6_super_mini]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino

; Architecture & Hardware Settings
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = default.csv

; Release USB-CDC from GPIO 12/13 so GPIO 13 functions as pure digital input for D-Pad LEFT
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUBOY_ESP32C6

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
